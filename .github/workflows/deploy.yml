# Build the site with Astro and publish it to GitHub Pages.
# Runs on every push to main, every night (to pick up design-system changes),
# and on demand from the Actions tab ("Run workflow").
name: Build and deploy
on:
  push:
    branches: [astro]   # switch back to [main] when the Vercel site is retired
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily — pulls the latest design-system
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (always fetch the latest design-system from GitHub)
        run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check the build (one h1 per page, no broken internal links)
        run: npm run check:html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
